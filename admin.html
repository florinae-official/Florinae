<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florinae — Product Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0e0c0a;--surface:#161412;--surface2:#1e1b18;--border:#2a2520;--text:#f0ece6;--muted:#7a7068;--dim:#4a4440;--accent:#c9956e;--accent2:#e8b48a;--gold:#d4a853;--success:#7ab87a;--danger:#c97070;--r:8px;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:3rem;}
  header{border-bottom:1px solid var(--border);padding:0 2rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:100;}
  .logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--accent2);letter-spacing:2px;text-transform:uppercase;}
  .logo span{font-size:11px;font-family:'DM Sans',sans-serif;font-weight:300;color:var(--muted);letter-spacing:3px;display:block;margin-top:-4px;}
  .back-btn{font-size:12px;color:var(--muted);text-decoration:none;letter-spacing:1px;}
  .back-btn:hover{color:var(--text);}
  .container{max-width:900px;margin:0 auto;padding:2rem 1.5rem;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem;}
  .card-title{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:1.2rem;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-group{display:flex;flex-direction:column;gap:5px;}
  .form-group.full{grid-column:1/-1;}
  label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);font-weight:500;}
  input,select{font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface2);color:var(--text);outline:none;transition:border-color 0.15s;width:100%;}
  input:focus,select:focus{border-color:var(--accent);}
  input::placeholder{color:var(--dim);}
  select option{background:var(--surface2);}
  .upload-area{border:1px dashed var(--border);border-radius:var(--r);padding:1.5rem;text-align:center;cursor:pointer;transition:border-color 0.2s;position:relative;}
  .upload-area:hover{border-color:var(--accent);}
  .upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
  .upload-label{font-size:12px;color:var(--muted);}
  .upload-preview{width:100%;height:120px;object-fit:cover;border-radius:var(--r);margin-top:10px;display:none;}
  .btn-add{margin-top:14px;width:100%;padding:11px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;letter-spacing:1px;text-transform:uppercase;background:var(--accent);color:#fff;border:none;border-radius:var(--r);cursor:pointer;transition:opacity 0.15s;}
  .btn-add:hover{opacity:0.85;}
  .btn-add:disabled{opacity:0.4;cursor:not-allowed;}
  .products-list{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .p-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
  .p-card-img{height:160px;background:linear-gradient(135deg,#2a2218,#1e1812);display:flex;align-items:center;justify-content:center;font-size:40px;opacity:0.3;position:relative;overflow:hidden;}
  .p-card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1;}
  .p-card-info{padding:10px 12px;}
  .p-card-cat{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
  .p-card-name{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--text);margin-bottom:4px;}
  .p-card-price{font-size:13px;color:var(--gold);margin-bottom:8px;}
  .p-card-actions{display:flex;gap:6px;}
  .btn-toggle{font-size:10px;padding:5px 10px;border-radius:6px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:1px;text-transform:uppercase;}
  .btn-active{background:rgba(122,184,122,0.15);color:var(--success);}
  .btn-inactive{background:rgba(201,112,112,0.15);color:var(--danger);}
  .btn-delete{font-size:10px;padding:5px 10px;border-radius:6px;border:1px solid var(--border);cursor:pointer;font-family:'DM Sans',sans-serif;background:none;color:var(--muted);}
  .btn-delete:hover{background:rgba(201,112,112,0.15);color:var(--danger);border-color:var(--danger);}
  .empty{text-align:center;padding:3rem;color:var(--muted);font-size:13px;grid-column:1/-1;}
  .badge-pill{display:inline-block;font-size:9px;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.5px;margin-left:6px;}
  .badge-new{background:rgba(212,168,83,0.2);color:var(--gold);}
  .badge-sale{background:rgba(201,112,112,0.2);color:var(--danger);}
  .uploading{font-size:12px;color:var(--accent);margin-top:6px;display:none;}
  @media(max-width:600px){.form-grid{grid-template-columns:1fr;}.products-list{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>

<header>
  <div class="logo">Florinae <span>Product Manager</span></div>
  <a href="index.html" class="back-btn">← View Website</a>
</header>

<div class="container">

  <div class="card">
    <div class="card-title">Add New Product</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Product Name *</label>
        <input type="text" id="f-name" placeholder="e.g. Gold Layered Necklace" />
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="f-category">
          <option value="Jewellery">Jewellery</option>
          <option value="Cosmetics">Cosmetics</option>
          <option value="Skincare">Skincare</option>
          <option value="Accessories">Accessories</option>
        </select>
      </div>
      <div class="form-group">
        <label>Price (৳) *</label>
        <input type="number" id="f-price" placeholder="0" min="0" />
      </div>
      <div class="form-group">
        <label>Original Price (৳) — for strikethrough</label>
        <input type="number" id="f-original-price" placeholder="Leave blank if no discount" min="0" />
      </div>
      <div class="form-group">
        <label>Badge</label>
        <select id="f-badge">
          <option value="">No badge</option>
          <option value="New">New</option>
          <option value="Sale">Sale</option>
          <option value="Bestseller">Bestseller</option>
          <option value="Limited">Limited</option>
        </select>
      </div>
      <div class="form-group full">
        <label>Product Photo</label>
        <div class="upload-area" id="upload-area">
          <input type="file" id="f-image" accept="image/*" onchange="previewImage(this)" />
          <div class="upload-label">📷 Click to upload photo<br><span style="font-size:11px;color:var(--dim)">JPG, PNG, WEBP supported</span></div>
          <img class="upload-preview" id="preview-img" />
        </div>
        <div class="uploading" id="uploading-text">Uploading image...</div>
      </div>
    </div>
    <button class="btn-add" id="add-btn" onclick="addProduct()">Add Product to Website</button>
  </div>

  <div class="card">
    <div class="card-title">All Products</div>
    <div class="products-list" id="products-list">
      <div class="empty">Loading...</div>
    </div>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://zogvgsahakzgmxtijhcj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_NoiER0HizjRVonZlIM9BKA_HrWtfPSI';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let products = [];

function previewImage(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const preview = document.getElementById('preview-img');
    preview.src = e.target.result;
    preview.style.display = 'block';
    document.querySelector('.upload-label').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

async function uploadImage(file) {
  const ext = file.name.split('.').pop();
  const fileName = `product-${Date.now()}.${ext}`;
  const { data, error } = await db.storage.from('product-images').upload(fileName, file, { upsert: true });
  if (error) throw error;
  const { data: urlData } = db.storage.from('product-images').getPublicUrl(fileName);
  return urlData.publicUrl;
}

async function addProduct() {
  const name = document.getElementById('f-name').value.trim();
  const price = parseFloat(document.getElementById('f-price').value);
  if (!name || !price) { alert('Product name and price are required!'); return; }

  const btn = document.getElementById('add-btn');
  btn.disabled = true; btn.textContent = 'Adding...';

  let imageUrl = null;
  const imageFile = document.getElementById('f-image').files[0];
  if (imageFile) {
    document.getElementById('uploading-text').style.display = 'block';
    btn.textContent = 'Uploading image...';
    try { imageUrl = await uploadImage(imageFile); } catch(e) { alert('Image upload failed: ' + e.message); btn.disabled = false; btn.textContent = 'Add Product to Website'; document.getElementById('uploading-text').style.display = 'none'; return; }
    document.getElementById('uploading-text').style.display = 'none';
  }

  const origPrice = parseFloat(document.getElementById('f-original-price').value) || null;
  const badge = document.getElementById('f-badge').value || null;

  const { error } = await db.from('products').insert({
    name,
    category: document.getElementById('f-category').value,
    price,
    original_price: origPrice,
    badge,
    image_url: imageUrl,
    is_active: true
  });

  btn.disabled = false; btn.textContent = 'Add Product to Website';
  if (error) { alert('Error: ' + error.message); return; }

  // Reset form
  document.getElementById('f-name').value = '';
  document.getElementById('f-price').value = '';
  document.getElementById('f-original-price').value = '';
  document.getElementById('f-badge').value = '';
  document.getElementById('f-image').value = '';
  document.getElementById('preview-img').style.display = 'none';
  document.querySelector('.upload-label').style.display = 'block';

  loadProducts();
}

async function toggleActive(id, current) {
  await db.from('products').update({ is_active: !current }).eq('id', id);
  loadProducts();
}

async function deleteProduct(id) {
  if (!confirm('Delete this product?')) return;
  await db.from('products').delete().eq('id', id);
  loadProducts();
}

async function loadProducts() {
  const { data } = await db.from('products').select('*').order('created_at', { ascending: false });
  products = data || [];
  const list = document.getElementById('products-list');
  if (!products.length) {
    list.innerHTML = '<div class="empty">No products yet. Add your first product above!</div>';
    return;
  }
  list.innerHTML = products.map(p => `
    <div class="p-card">
      <div class="p-card-img">
        ${p.image_url ? `<img src="${p.image_url}" alt="${p.name}" />` : '✨'}
      </div>
      <div class="p-card-info">
        <div class="p-card-cat">${p.category || ''}${p.badge ? `<span class="badge-pill badge-${p.badge.toLowerCase()}">${p.badge}</span>` : ''}</div>
        <div class="p-card-name">${p.name}</div>
        <div class="p-card-price">৳${Number(p.price).toLocaleString()}${p.original_price ? ` <span style="text-decoration:line-through;color:var(--muted);font-size:11px">৳${Number(p.original_price).toLocaleString()}</span>` : ''}</div>
        <div class="p-card-actions">
          <button class="btn-toggle ${p.is_active ? 'btn-active' : 'btn-inactive'}" onclick="toggleActive(${p.id}, ${p.is_active})">${p.is_active ? '✓ Visible' : '✗ Hidden'}</button>
          <button class="btn-delete" onclick="deleteProduct(${p.id})">Delete</button>
        </div>
      </div>
    </div>
  `).join('');
}

loadProducts();
</script>
</body>
</html>
