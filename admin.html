<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florinae — Product Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0e0c0a;--surface:#161412;--surface2:#1e1b18;--border:#2a2520;--text:#f0ece6;--muted:#7a7068;--dim:#4a4440;--accent:#c9956e;--accent2:#e8b48a;--gold:#d4a853;--success:#7ab87a;--danger:#c97070;--r:8px;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:3rem;}
  header{border-bottom:1px solid var(--border);padding:0 2rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:100;}
  .logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--accent2);letter-spacing:2px;text-transform:uppercase;}
  .logo span{font-size:11px;font-family:'DM Sans',sans-serif;font-weight:300;color:var(--muted);letter-spacing:3px;display:block;margin-top:-4px;}
  .back-btn{font-size:12px;color:var(--muted);text-decoration:none;letter-spacing:1px;transition:color 0.2s;}
  .back-btn:hover{color:var(--text);}
  .container{max-width:900px;margin:0 auto;padding:2rem 1.5rem;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem;animation:fadeIn 0.3s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .card-title{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:1.2rem;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-group{display:flex;flex-direction:column;gap:5px;}
  .form-group.full{grid-column:1/-1;}
  label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);font-weight:500;}
  input,select,textarea{font-family:'DM Sans',sans-serif;font-size:13px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface2);color:var(--text);outline:none;transition:border-color 0.2s,box-shadow 0.2s;width:100%;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(201,149,110,0.1);}
  input::placeholder,textarea::placeholder{color:var(--dim);}
  select option{background:var(--surface2);}
  textarea{resize:vertical;min-height:70px;}

  /* UPLOAD AREA */
  .upload-area{border:1px dashed var(--border);border-radius:var(--r);padding:1.5rem;text-align:center;cursor:pointer;transition:border-color 0.2s,background 0.2s;position:relative;overflow:hidden;}
  .upload-area:hover{border-color:var(--accent);background:rgba(201,149,110,0.04);}
  .upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
  .upload-label{font-size:12px;color:var(--muted);}
  .upload-preview{width:100%;height:120px;object-fit:cover;border-radius:var(--r);margin-top:10px;display:none;}
  .upload-progress{height:3px;background:var(--border);border-radius:2px;margin-top:8px;display:none;overflow:hidden;}
  .upload-progress-bar{height:100%;background:var(--accent);width:0%;transition:width 0.3s ease;border-radius:2px;}
  .compress-info{font-size:10px;color:var(--muted);margin-top:6px;display:none;}

  /* GALLERY UPLOAD */
  .gallery-upload-area{border:1px dashed var(--border);border-radius:var(--r);padding:12px;cursor:pointer;transition:border-color 0.2s;position:relative;text-align:center;}
  .gallery-upload-area:hover{border-color:var(--accent);}
  .gallery-upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
  .gallery-previews-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .gallery-preview-item{position:relative;width:60px;height:60px;}
  .gallery-preview-item img{width:100%;height:100%;object-fit:cover;border-radius:4px;border:1px solid var(--border);}
  .gallery-preview-remove{position:absolute;top:-4px;right:-4px;width:16px;height:16px;background:var(--danger);border:none;border-radius:50%;cursor:pointer;font-size:10px;color:#fff;display:flex;align-items:center;justify-content:center;line-height:1;}

  /* VARIANT ROW */
  .variant-row{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:10px;display:grid;grid-template-columns:36px 1fr 100px auto;gap:8px;align-items:start;}
  .variant-color-input{width:36px;height:36px;padding:2px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);cursor:pointer;margin-top:2px;}
  .variant-upload-mini{position:relative;border:1px dashed var(--border);border-radius:6px;padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:6px;margin-top:6px;transition:border-color 0.2s;}
  .variant-upload-mini:hover{border-color:var(--accent);}
  .variant-upload-mini input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
  .variant-preview-small{width:36px;height:36px;object-fit:cover;border-radius:4px;display:none;}

  /* BUTTONS */
  .btn-add{margin-top:14px;width:100%;padding:11px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;letter-spacing:1px;text-transform:uppercase;background:var(--accent);color:#fff;border:none;border-radius:var(--r);cursor:pointer;transition:opacity 0.25s ease,transform 0.18s ease;}
  .btn-add:hover{opacity:0.85;}
  .btn-add:active{transform:scale(0.98);}
  .btn-add:disabled{opacity:0.4;cursor:not-allowed;}

  /* PRODUCTS LIST */
  .filter-row{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;}
  .filter-row input{flex:2;min-width:140px;font-size:13px;}
  .filter-row select{flex:1;min-width:120px;font-size:13px;}
  .products-list{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .p-card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
  .p-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);overflow:visible;transition:transform 0.25s cubic-bezier(0.4,0,0.2,1),box-shadow 0.25s cubic-bezier(0.4,0,0.2,1);}
  .p-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.3);}
  .p-card-img{height:140px;background:linear-gradient(135deg,#2a2218,#1e1812);display:flex;align-items:center;justify-content:center;font-size:36px;opacity:0.3;position:relative;overflow:hidden;}
  .p-card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1;}
  .p-card-info{padding:10px 12px;}
  .p-card-cat{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
  .p-card-name{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--text);margin-bottom:4px;}
  .p-card-price{font-size:13px;color:var(--gold);margin-bottom:8px;}
  .p-card-actions{display:flex;gap:6px;}
  .btn-toggle{font-size:10px;padding:5px 10px;border-radius:6px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:1px;text-transform:uppercase;transition:all 0.2s;}
  .btn-active{background:rgba(122,184,122,0.15);color:var(--success);}
  .btn-inactive{background:rgba(201,112,112,0.15);color:var(--danger);}
  .btn-delete{font-size:10px;padding:5px 10px;border-radius:6px;border:1px solid var(--border);cursor:pointer;font-family:'DM Sans',sans-serif;background:none;color:var(--muted);transition:all 0.2s;}
  .btn-delete:hover{background:rgba(201,112,112,0.15);color:var(--danger);border-color:var(--danger);}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:2rem;grid-column:1/-1;}
  .badge-pill{display:inline-block;font-size:9px;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.5px;margin-left:6px;}
  .badge-new{background:rgba(212,168,83,0.2);color:var(--gold);}
  .badge-sale{background:rgba(201,112,112,0.2);color:var(--danger);}
  .compress-badge{font-size:9px;padding:1px 6px;background:rgba(122,184,122,0.2);color:var(--success);border-radius:4px;margin-left:4px;}

  .pag-row{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:1rem;flex-wrap:wrap;}
  .pag-btn{font-family:'DM Sans',sans-serif;font-size:11px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;transition:all 0.2s;}
  .pag-btn:hover:not(.dis){border-color:var(--accent);color:var(--accent);}
  .pag-btn.act{background:var(--accent);color:#fff;border-color:var(--accent);}
  .pag-btn.dis{opacity:0.3;cursor:not-allowed;}

  /* ── AUTH OVERLAY ── */
  #auth-overlay{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;}
  #auth-overlay.hidden{display:none;}
  #admin-content{display:none;}
  #admin-content.visible{display:block;}
  .auth-box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2.8rem 2.2rem;display:flex;flex-direction:column;gap:1.4rem;animation:fadeIn 0.35s ease;}
  .auth-logo{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;color:var(--accent2);letter-spacing:3px;text-transform:uppercase;text-align:center;}
  .auth-logo span{font-size:11px;font-family:'DM Sans',sans-serif;font-weight:300;color:var(--muted);letter-spacing:4px;display:block;margin-top:-3px;}
  .auth-subtitle{font-size:12px;color:var(--dim);text-align:center;letter-spacing:0.5px;}
  .auth-field{display:flex;flex-direction:column;gap:6px;}
  .auth-field label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);font-weight:500;}
  .auth-field input{padding:10px 40px 10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color 0.2s,box-shadow 0.2s;width:100%;}
  .auth-field input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(201,149,110,0.12);}
  .auth-field-wrap{position:relative;}
  .auth-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--dim);font-size:14px;padding:0;line-height:1;transition:color 0.2s;}
  .auth-eye:hover{color:var(--muted);}
  .auth-btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:opacity 0.2s,transform 0.15s;margin-top:4px;}
  .auth-btn:hover{opacity:0.87;}
  .auth-btn:active{transform:scale(0.98);}
  .auth-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .auth-error{font-size:12px;color:var(--danger);text-align:center;display:none;padding:8px 12px;background:rgba(201,112,112,0.08);border-radius:var(--r);border:1px solid rgba(201,112,112,0.2);}
  .auth-loading{font-size:12px;color:var(--muted);text-align:center;display:none;}

  /* logout button in header */
  .logout-btn{font-size:11px;padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:none;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:1px;transition:all 0.2s;display:none;}
  .logout-btn:hover{border-color:var(--danger);color:var(--danger);}
  .logout-btn.visible{display:inline-flex;align-items:center;gap:5px;}

  /* ── ADMIN TOAST ── */
  #admin-toast{
    position:fixed;top:1.2rem;right:1.2rem;
    min-width:220px;max-width:360px;
    padding:12px 18px;
    border-radius:10px;
    font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;
    display:flex;align-items:center;gap:10px;
    box-shadow:0 8px 28px rgba(0,0,0,0.4);
    z-index:99999;
    opacity:0;pointer-events:none;
    transform:translateX(24px);
    transition:opacity 0.28s ease,transform 0.28s cubic-bezier(0.4,0,0.2,1);
  }
  #admin-toast.show{opacity:1;pointer-events:auto;transform:translateX(0);}
  #admin-toast.success{background:#1b2e1b;border:1px solid var(--success);color:var(--success);}
  #admin-toast.error{background:#2e1b1b;border:1px solid var(--danger);color:var(--danger);}
</style>
</head>
<body>

<!-- ── SUPABASE AUTH OVERLAY ── -->
<div id="admin-toast" role="status" aria-live="polite"></div>
<div id="auth-overlay">
  <div class="auth-box">
    <div class="auth-logo">Florinae <span>Admin Panel</span></div>
    <div class="auth-subtitle">Sign in to continue</div>

    <div class="auth-field">
      <label>Email</label>
      <input type="email" id="auth-email" placeholder="admin@example.com" autocomplete="email" onkeydown="if(event.key==='Enter')document.getElementById('auth-pw').focus()" />
    </div>

    <div class="auth-field">
      <label>Password</label>
      <div class="auth-field-wrap">
        <input type="password" id="auth-pw" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doSignIn()" />
        <button class="auth-eye" id="auth-eye-btn" onclick="toggleAuthEye()" tabindex="-1">👁</button>
      </div>
    </div>

    <div class="auth-error" id="auth-error"></div>
    <div class="auth-loading" id="auth-loading">Signing in…</div>

    <button class="auth-btn" id="auth-submit-btn" onclick="doSignIn()">Sign In</button>
  </div>
</div>

<!-- ── ADMIN CONTENT (hidden until authed) ── -->
<div id="admin-content">
<header>
  <div class="logo">Florinae <span>Product Manager</span></div>
  <div style="display:flex;align-items:center;gap:12px;">
    <span id="auth-user-email" style="font-size:11px;color:var(--dim);letter-spacing:0.5px;"></span>
    <a href="index.html" class="back-btn">← View Website</a>
    <button class="logout-btn visible" id="logout-btn" onclick="doSignOut()">↪ Sign Out</button>
  </div>
</header>

<div class="container">

  <!-- ADD PRODUCT -->
  <div class="card">
    <div class="card-title">Add New Product</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Product Name *</label>
        <input type="text" id="f-name" placeholder="e.g. Gold Layered Necklace" />
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="f-category" onchange="updateSubCats()">
          <option value="Jewellery">Jewellery</option>
          <option value="Beauty">Beauty</option>
          <option value="Skincare">Skincare</option>
          <option value="Accessories">Accessories</option>
        </select>
      </div>
      <div class="form-group">
        <label>Sub-Category</label>
        <select id="f-subcategory">
          <option value="">Select sub-category</option>
          <option value="Bangles">Bangles</option>
          <option value="Ring">Ring</option>
          <option value="Earrings">Earrings</option>
          <option value="Bracelets">Bracelets</option>
          <option value="Handchains">Handchains</option>
        </select>
      </div>
      <div class="form-group">
        <label>Badge</label>
        <select id="f-badge">
          <option value="">No badge</option>
          <option value="New">New</option>
          <option value="Sale">Sale</option>
          <option value="Bestseller">Bestseller</option>
          <option value="Limited">Limited</option>
        </select>
      </div>
      <div class="form-group">
        <label>Price (৳) *</label>
        <input type="number" id="f-price" placeholder="0" min="0" />
      </div>
      <div class="form-group">
        <label>Original Price (৳) — strikethrough</label>
        <input type="number" id="f-original-price" placeholder="Leave blank if no discount" min="0" />
      </div>
      <div class="form-group full">
        <label>Description (optional)</label>
        <textarea id="f-description" placeholder="Product details..."></textarea>
      </div>

      <!-- MAIN PHOTO -->
      <div class="form-group full">
        <label>Main Product Photo <span class="compress-badge">Auto-optimized to WebP</span></label>
        <div class="upload-area" id="upload-area">
          <input type="file" id="f-image" accept="image/*" onchange="previewMainImage(this)" />
          <div class="upload-label" id="upload-label-text">📷 Click to upload photo<br><span style="font-size:11px;color:var(--dim)">Will be auto-compressed & converted to WebP</span></div>
          <img class="upload-preview" id="preview-img" />
          <div class="upload-progress" id="upload-progress"><div class="upload-progress-bar" id="upload-progress-bar"></div></div>
          <div class="compress-info" id="compress-info"></div>
        </div>
      </div>

      <!-- GALLERY -->
      <div class="form-group full">
        <label>Gallery Photos (extra images) <span class="compress-badge">Auto-optimized</span></label>
        <div class="gallery-upload-area">
          <input type="file" id="f-gallery" accept="image/*" multiple onchange="previewGallery(this)" />
          <div style="font-size:12px;color:var(--muted);">📷 Select multiple photos for gallery</div>
          <div class="gallery-previews-row" id="gallery-previews"></div>
        </div>
      </div>

      <!-- VARIANTS -->
      <div class="form-group full">
        <label>Color / Size Variants <span class="compress-badge">Photos auto-optimized</span></label>
        <div id="variants-list" style="display:flex;flex-direction:column;gap:8px;margin-bottom:8px;"></div>
        <button type="button" onclick="addVariantRow()" style="font-size:11px;padding:7px 16px;border:1px dashed var(--border);background:none;color:var(--muted);border-radius:var(--r);cursor:pointer;font-family:'DM Sans',sans-serif;transition:border-color 0.2s,color 0.2s;">+ Add Color / Variant</button>
      </div>
    </div>
    <button class="btn-add" id="add-btn" onclick="addProduct()">Add Product to Website</button>
  </div>

  <!-- ALL PRODUCTS -->
  <div class="card">
    <div class="card-title">All Products</div>
    <div class="filter-row">
      <input type="text" id="prod-search" placeholder="Search by name..." oninput="filterProducts()" />
      <select id="prod-cat-filter" onchange="filterProducts()">
        <option value="">All Categories</option>
        <option value="Jewellery">Jewellery</option>
        <option value="Beauty">Beauty</option>
        <option value="Skincare">Skincare</option>
        <option value="Accessories">Accessories</option>
      </select>
      <select id="prod-status-filter" onchange="filterProducts()">
        <option value="">All Status</option>
        <option value="active">Active</option>
        <option value="hidden">Hidden</option>
      </select>
    </div>
    <div class="products-list" id="products-list">
      <div class="empty">Loading...</div>
    </div>
    <div class="pag-row" id="admin-pagination"></div>
  </div>

  <!-- BUNDLE DEAL -->
  <div class="card">
    <div class="card-title">Bundle Deal</div>
    <div id="bundle-deal-wrap"><div class="empty">Loading...</div></div>
  </div>

  <!-- ANNOUNCEMENT BAR -->
  <div class="card">
    <div class="card-title">Announcement Bar</div>
    <div style="display:flex;gap:8px;margin-bottom:1rem;">
      <input type="text" id="ann-input" placeholder="e.g. Free delivery on orders above ৳500" style="flex:1;" />
      <button onclick="addAnnouncement()" style="font-family:'DM Sans',sans-serif;font-size:12px;padding:9px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--r);cursor:pointer;white-space:nowrap;transition:opacity 0.2s;">+ Add</button>
    </div>
    <div id="ann-list"><div class="empty">Loading...</div></div>
  </div>

</div>

</div><!-- end #admin-content -->

<script>
// ════════════════════════════════════════════
// 🔧 SUPABASE CONFIG — ekhane apnar credentials boshan
// ════════════════════════════════════════════
const SUPABASE_URL = 'https://zogvgsahakzgmxtijhcj.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvZ3Znc2FoYWt6Z214dGlqaGNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0Mjc2NTAsImV4cCI6MjA5NTAwMzY1MH0.HC1_eocrY06VxxYFJ5sTfO8LtE7as7OOzF2s4MZGxG4';
// ════════════════════════════════════════════

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Storage client with service role — bypasses RLS for uploads
const SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvZ3Znc2FoYWt6Z214dGlqaGNqIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3OTQyNzY1MCwiZXhwIjoyMDk1MDAzNjUwfQ.S4ifj6zXdIYFSYDhGMYKGGTtkAdJrTI8K_Uk3l-jx4Q';
const storage = supabase.createClient(SUPABASE_URL, SERVICE_KEY);

const SUB_CATS_MAP={Jewellery:['Bangles','Ring','Earrings','Bracelets','Handchains'],Beauty:['Blush','Lip','Face','Eyes'],Skincare:['Mask','Pimple Patch','Eye Mask'],Accessories:['Fake Nails','Organizer']};

let products=[];
let variantCount=0;
let galleryFileObjects=[];

// ── IMAGE COMPRESSION ──
// Compress + resize + convert to WebP using Canvas
function compressImage(file, maxW, maxH, quality=0.82){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width, h=img.height;
        // Maintain aspect ratio
        if(w>maxW||h>maxH){
          const ratio=Math.min(maxW/w,maxH/h);
          w=Math.round(w*ratio);
          h=Math.round(h*ratio);
        }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        canvas.toBlob(blob=>{
          if(!blob){reject(new Error('Compression failed'));return;}
          resolve({blob, width:w, height:h, originalSize:file.size, newSize:blob.size});
        },'image/webp',quality);
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function formatBytes(b){return b<1024?b+'B':b<1048576?(b/1024).toFixed(1)+'KB':(b/1048576).toFixed(2)+'MB';}

// ── DEBUG: show error on screen ──
function showErr(msg){
  let d=document.getElementById('debug-box');
  if(!d){d=document.createElement('div');d.id='debug-box';d.style.cssText='position:fixed;bottom:80px;left:10px;right:10px;background:#1a0a0a;color:#ff9090;font-size:11px;padding:12px;border-radius:8px;z-index:9999;white-space:pre-wrap;border:1px solid #c97070;max-height:200px;overflow-y:auto;';document.body.appendChild(d);}
  d.textContent=msg;
}

// ── UPLOAD IMAGE (compressed) ──
async function uploadImageCompressed(file, prefix='product'){
  const {blob:fullBlob, originalSize, newSize}=await compressImage(file, 900, 900, 0.82);
  const {blob:thumbBlob}=await compressImage(file, 400, 400, 0.75);

  const ts=Date.now();
  const fullName=`${prefix}-${ts}.webp`;
  const thumbName=`${prefix}-thumb-${ts}.webp`;

  const [fullRes, thumbRes]=await Promise.all([
    storage.storage.from('product-images').upload(fullName, fullBlob, {contentType:'image/webp', upsert:true}),
    storage.storage.from('product-images').upload(thumbName, thumbBlob, {contentType:'image/webp', upsert:true})
  ]);

  if(fullRes.error){showErr(`UPLOAD ERROR:\n${JSON.stringify(fullRes.error)}`);throw fullRes.error;}
  if(thumbRes.error){showErr(`THUMB ERROR:\n${JSON.stringify(thumbRes.error)}`);throw thumbRes.error;}

  const {data:{publicUrl:fullUrl}}=storage.storage.from('product-images').getPublicUrl(fullName);
  const {data:{publicUrl:thumbUrl}}=storage.storage.from('product-images').getPublicUrl(thumbName);

  return {imageUrl:fullUrl, thumbnailUrl:thumbUrl, originalSize, newSize};
}

// Variant/gallery: only full, no separate thumbnail needed
async function uploadImageSingle(file, prefix='img'){
  const {blob, originalSize, newSize}=await compressImage(file, 900, 900, 0.82);
  const name=`${prefix}-${Date.now()}.webp`;
  const {error}=await storage.storage.from('product-images').upload(name, blob, {contentType:'image/webp', upsert:true});
  if(error){showErr(`SINGLE UPLOAD ERROR:\n${JSON.stringify(error)}`);throw error;}
  const {data:{publicUrl}}=storage.storage.from('product-images').getPublicUrl(name);
  return {url:publicUrl, originalSize, newSize};
}

// ── PREVIEW MAIN IMAGE ──
async function previewMainImage(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const p=document.getElementById('preview-img');
    p.src=e.target.result; p.style.display='block';
    document.getElementById('upload-label-text').style.display='none';
  };
  reader.readAsDataURL(file);
  // Show compression estimate
  const {blob}=await compressImage(file, 900, 900, 0.82);
  const info=document.getElementById('compress-info');
  info.style.display='block';
  info.textContent=`Original: ${formatBytes(file.size)} → Compressed: ${formatBytes(blob.size)} (${Math.round((1-blob.size/file.size)*100)}% smaller)`;
}

function removeVariant(id){document.getElementById(`vrow-${id}`)?.remove();}

function previewVariant(input,id){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const p=document.getElementById(`vpreview-${id}`);
    p.src=e.target.result; p.style.display='block';
    document.getElementById(`vupload-lbl-${id}`).textContent='✓ Photo selected';
  };
  reader.readAsDataURL(file);
}

async function getVariants(btn){
  const list=document.getElementById('variants-list');
  const rows=list.querySelectorAll('[id^="vrow-"]');
  const variants=[];
  for(const row of rows){
    const m=row.id.match(/vrow-(\d+)/);
    if(!m)continue;
    const i=m[1];
    const name=document.getElementById(`vname-${i}`)?.value.trim();
    const color=document.getElementById(`vcolor-${i}`)?.value;
    const price=parseFloat(document.getElementById(`vprice-${i}`)?.value)||null;
    if(!name)continue;
    let imageUrl=null;
    const imgFile=document.getElementById(`vimage-${i}`)?.files[0];
    if(imgFile){
      try{
        if(btn)btn.textContent='Uploading variant...';
        const{url}=await uploadImageSingle(imgFile,'variant');
        imageUrl=url;
      }catch(e){console.error('Variant upload failed',e);}
    }
    variants.push({name,color,price,image_url:imageUrl});
  }
  return variants;
}

// ── ADD PRODUCT ──
async function addProduct(){
  const name=document.getElementById('f-name').value.trim();
  const price=parseFloat(document.getElementById('f-price').value);
  if(!name){showAdminToast('⚠️ Product name cannot be empty.','error');document.getElementById('f-name').focus();return;}
  if(!price||price<=0){showAdminToast('⚠️ Price must be greater than 0.','error');document.getElementById('f-price').focus();return;}

  const btn=document.getElementById('add-btn');
  btn.disabled=true; btn.textContent='Processing...';

  // Show progress
  const progress=document.getElementById('upload-progress');
  const bar=document.getElementById('upload-progress-bar');
  progress.style.display='block'; bar.style.width='10%';

  let imageUrl=null, thumbnailUrl=null;
  const imageFile=document.getElementById('f-image').files[0];
  if(imageFile){
    try{
      btn.textContent='Compressing image...'; bar.style.width='30%';
      const result=await uploadImageCompressed(imageFile,'product');
      imageUrl=result.imageUrl; thumbnailUrl=result.thumbnailUrl;
      bar.style.width='50%';
    }catch(e){showAdminToast('❌ Image upload failed: '+e.message,'error');btn.disabled=false;btn.textContent='Add Product to Website';progress.style.display='none';return;}
  }

  // Gallery
  const galleryUrls=[];
  if(galleryFileObjects.length>0){
    btn.textContent='Uploading gallery...'; bar.style.width='60%';
    for(const f of galleryFileObjects){
      try{const{url}=await uploadImageSingle(f,'gallery');galleryUrls.push(url);}
      catch(e){console.error('Gallery upload failed',e);}
    }
  }

  bar.style.width='80%'; btn.textContent='Uploading variants...';
  const variants=await getVariants(btn);

  bar.style.width='90%'; btn.textContent='Saving...';

  const{error}=await db.from('products').insert({
    name,
    category:document.getElementById('f-category').value,
    sub_category:document.getElementById('f-subcategory').value||null,
    description:document.getElementById('f-description').value.trim()||null,
    price,
    original_price:parseFloat(document.getElementById('f-original-price').value)||null,
    badge:document.getElementById('f-badge').value||null,
    image_url:imageUrl,
    thumbnail_url:thumbnailUrl,
    gallery:galleryUrls,
    variants,
    is_active:true
  });

  btn.disabled=false; btn.textContent='Add Product to Website';
  progress.style.display='none'; bar.style.width='0%';

  if(error){showAdminToast('❌ Error: '+error.message,'error');return;}

  showAdminToast('✓ Product added successfully!','success');

  // Reset
  ['f-name','f-price','f-original-price','f-description'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-badge').value='';
  document.getElementById('f-image').value='';
  document.getElementById('preview-img').style.display='none';
  document.getElementById('upload-label-text').style.display='block';
  document.getElementById('compress-info').style.display='none';
  document.getElementById('f-gallery').value='';
  document.getElementById('gallery-previews').innerHTML='';
  document.getElementById('variants-list').innerHTML='';
  galleryFileObjects=[];

  await loadProducts();
}

// ── LOAD / FILTER PRODUCTS ──
async function loadProducts(){
  const{data}=await db.from('products').select('*').order('created_at',{ascending:false});
  products=data||[];
  filterProducts();
}

const ADMIN_PER=12;
let adminPage=1;

function filterProducts(){
  const search=document.getElementById('prod-search')?.value.toLowerCase()||'';
  const cat=document.getElementById('prod-cat-filter')?.value||'';
  const status=document.getElementById('prod-status-filter')?.value||'';
  const filtered=products.filter(p=>{
    const ms=!search||(p.name||'').toLowerCase().includes(search)||(p.category||'').toLowerCase().includes(search);
    const mc=!cat||p.category===cat;
    const mst=!status||(status==='active'?p.is_active:!p.is_active);
    return ms&&mc&&mst;
  });

  const totalPages=Math.ceil(filtered.length/ADMIN_PER);
  if(adminPage>totalPages)adminPage=1;
  const paged=filtered.slice((adminPage-1)*ADMIN_PER, adminPage*ADMIN_PER);

  const list=document.getElementById('products-list');
  const pag=document.getElementById('admin-pagination');

  if(!filtered.length){
    list.innerHTML=`<div class="empty">${!products.length?'No products yet!':'No products match.'}</div>`;
    pag.innerHTML='';return;
  }

  list.innerHTML=paged.map(p=>`
    <div class="p-card">
      <div class="p-card-img">${p.thumbnail_url||p.image_url?`<img src="${p.thumbnail_url||p.image_url}" alt="${p.name}" loading="lazy">`:'✨'}</div>
      <div class="p-card-info">
        <div class="p-card-cat">${p.sub_category||p.category||''}${p.badge?`<span class="badge-pill badge-${p.badge.toLowerCase()}">${p.badge}</span>`:''}</div>
        <div class="p-card-name">${p.name}</div>
        <div class="p-card-price">৳${Number(p.price).toLocaleString()}${p.original_price?` <span style="text-decoration:line-through;color:var(--muted);font-size:11px">৳${Number(p.original_price).toLocaleString()}</span>`:''}</div>
        <div class="p-card-actions">
          <button class="btn-toggle ${p.is_active?'btn-active':'btn-inactive'}" onclick="toggleActive(${p.id},${p.is_active})">${p.is_active?'✓ Visible':'✗ Hidden'}</button>
          <button class="btn-delete" onclick="deleteProduct(${p.id})">Delete</button>
        </div>
      </div>
    </div>`).join('');

  // Pagination
  if(totalPages<=1){pag.innerHTML='';return;}
  let h=`<button class="pag-btn${adminPage===1?' dis':''}" onclick="adminGoPage(${adminPage-1})">←</button>`;
  for(let i=1;i<=totalPages;i++){
    if(i===1||i===totalPages||Math.abs(i-adminPage)<=1) h+=`<button class="pag-btn${i===adminPage?' act':''}" onclick="adminGoPage(${i})">${i}</button>`;
    else if(Math.abs(i-adminPage)===2) h+=`<span style="color:var(--muted);padding:0 4px">…</span>`;
  }
  h+=`<button class="pag-btn${adminPage===totalPages?' dis':''}" onclick="adminGoPage(${adminPage+1})">→</button>`;
  pag.innerHTML=h;
}

function adminGoPage(p){
  const filtered=products.filter(pr=>{
    const search=document.getElementById('prod-search')?.value.toLowerCase()||'';
    const cat=document.getElementById('prod-cat-filter')?.value||'';
    const status=document.getElementById('prod-status-filter')?.value||'';
    const ms=!search||(pr.name||'').toLowerCase().includes(search);
    const mc=!cat||pr.category===cat;
    const mst=!status||(status==='active'?pr.is_active:!pr.is_active);
    return ms&&mc&&mst;
  });
  const total=Math.ceil(filtered.length/ADMIN_PER);
  if(p<1||p>total)return;
  adminPage=p;
  filterProducts();
  document.getElementById('products-list').scrollIntoView({behavior:'smooth'});
}

async function toggleActive(id,current){
  await db.from('products').update({is_active:!current}).eq('id',id);
  await loadProducts();
}

async function deleteProduct(id){
  if(!confirm('Delete this product? This cannot be undone.'))return;
  await db.from('products').delete().eq('id',id);
  const filtered=products.filter(p=>p.id!==id);
  const totalPages=Math.ceil(filtered.length/ADMIN_PER);
  if(adminPage>totalPages&&adminPage>1)adminPage=totalPages||1;
  showAdminToast('✓ Product deleted.','success');
  await loadProducts();
}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
      <div style="display:flex;flex-direction:column;gap:5px;"><label>Title</label><input type="text" id="bd-title" value="${deal.title||''}" /></div>
      <div style="display:flex;flex-direction:column;gap:5px;"><label>Description</label><input type="text" id="bd-desc" value="${deal.description||''}" /></div>
      <div style="display:flex;flex-direction:column;gap:5px;"><label>Min Items</label><input type="number" id="bd-min" value="${deal.min_items||2}" min="1" /></div>
      <div style="display:flex;flex-direction:column;gap:5px;"><label>Discount %</label><input type="number" id="bd-pct" value="${deal.discount_percent||10}" min="1" max="99" /></div>

    </div>`;
}

async function saveBundleDeal(id){
  await db.from('bundle_deals').update({title:document.getElementById('bd-title').value.trim(),description:document.getElementById('bd-desc').value.trim(),min_items:parseInt(document.getElementById('bd-min').value)||2,discount_percent:parseFloat(document.getElementById('bd-pct').value)||10}).eq('id',id);

async function toggleBundleDeal(id,current){await db.from('bundle_deals').update({is_active:!current}).eq('id',id);loadBundleDeal();}

async function addAnnouncement(){

async function toggleAnn(id,current){await db.from('announcements').update({is_active:!current}).eq('id',id);loadAnnouncements();}
async function deleteAnn(id){if(!confirm('Delete?'))return;await db.from('announcements').delete().eq('id',id);loadAnnouncements();}

// ── SUPABASE AUTH ──

function showAdminUI(user) {
  document.getElementById('auth-overlay').classList.add('hidden');
  document.getElementById('admin-content').classList.add('visible');
  document.getElementById('auth-user-email').textContent = user.email;
}

function showLoginUI() {
  document.getElementById('auth-overlay').classList.remove('hidden');
  document.getElementById('admin-content').classList.remove('visible');
  document.getElementById('auth-user-email').textContent = '';
}

async function doSignIn() {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-pw').value;
  const errEl = document.getElementById('auth-error');
  const loadEl = document.getElementById('auth-loading');
  const btn = document.getElementById('auth-submit-btn');

  if (!email || !password) {
    errEl.textContent = 'Email and password are required.';
    errEl.style.display = 'block';
    return;
  }

  errEl.style.display = 'none';
  loadEl.style.display = 'block';
  btn.disabled = true;

  const { data, error } = await db.auth.signInWithPassword({ email, password });

  loadEl.style.display = 'none';
  btn.disabled = false;

  if (error) {
    errEl.textContent = error.message === 'Invalid login credentials'
      ? 'Incorrect email or password.'
      : error.message;
    errEl.style.display = 'block';
    document.getElementById('auth-pw').value = '';
    return;
  }

  showAdminUI(data.user);
  loadProducts(); loadBundleDeal(); loadAnnouncements();
}

async function doSignOut() {
  if (!confirm('Are you sure you want to sign out?')) return;
  await db.auth.signOut();
  showLoginUI();
  document.getElementById('auth-email').value = '';
  document.getElementById('auth-pw').value = '';
}

function toggleAuthEye() {
  const inp = document.getElementById('auth-pw');
  const btn = document.getElementById('auth-eye-btn');
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
  else { inp.type = 'password'; btn.textContent = '👁'; }
}

// ── ADMIN TOAST ──
let _toastTimer=null;
function showAdminToast(msg,type='success'){
  const el=document.getElementById('admin-toast');
  if(!el)return;
  clearTimeout(_toastTimer);
  el.textContent=msg;
  el.className=type+' show';
  _toastTimer=setTimeout(()=>{el.classList.remove('show');},3000);
}

// ── ON PAGE LOAD: check existing session ──
(async function () {
  const { data: { session } } = await db.auth.getSession();
  if (session && session.user) {
    showAdminUI(session.user);
    loadProducts(); loadBundleDeal(); loadAnnouncements();
  } else {
    showLoginUI();
  }

  // Listen for auth state changes (logout from another tab, token refresh, etc.)
  db.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT' || !session) {
      showLoginUI();
    } else if (event === 'SIGNED_IN' && session) {
      showAdminUI(session.user);
    }
  });
})();
